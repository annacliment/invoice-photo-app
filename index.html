<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lector de facturas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Prototipo</p>
          <h1>Lector de facturas</h1>
          <p class="subtitle">Sube una o varias fotos de facturas, tickets o abonos. Se leen automáticamente y puedes corregir cualquier campo.</p>
        </div>
      </header>

      <main class="layout">
        <section class="panel upload-panel">
          <div class="panel-header">
            <h2>Subir facturas</h2>
          </div>

          <label class="upload-box" id="dropZone" for="invoiceInput">
            <input id="invoiceInput" type="file" accept="image/*" multiple />
            <div class="upload-icon">⬆</div>
            <p>Haz clic o arrastra aquí una o varias fotos</p>
            <small>PNG, JPG o WEBP · varias a la vez</small>
          </label>

          <div class="actions">
            <button id="processButton" class="primary-btn" disabled>Leer facturas</button>
            <button id="clearButton" class="secondary-btn" disabled>Vaciar</button>
          </div>

          <p id="status" class="status">Esperando imágenes…</p>

          <div class="export-box">
            <h3>Exportar</h3>
            <div class="actions">
              <button id="exportCsvButton" class="secondary-btn" disabled>CSV (Excel)</button>
              <button id="exportJsonButton" class="secondary-btn" disabled>JSON</button>
            </div>
          </div>
        </section>

        <section class="panel results-panel">
          <div class="panel-header results-header">
            <h2>Datos extraídos</h2>
            <span id="summary" class="summary"></span>
          </div>
          <div id="results" class="results">
            <div class="empty-state">Todavía no hay facturas. Sube una o varias fotos para empezar.</div>
          </div>
        </section>
      </main>
    </div>

    <template id="invoiceCardTemplate">
      <article class="invoice-card">
        <div class="invoice-card-head">
          <img class="thumb" alt="Vista previa de la factura" />
          <div class="invoice-title">
            <strong class="file-name"></strong>
            <span class="badge"></span>
          </div>
          <button class="icon-btn remove-btn" title="Quitar esta factura" aria-label="Quitar esta factura">✕</button>
        </div>
        <div class="progress"><div class="progress-bar"></div></div>
        <div class="warnings"></div>
        <form class="invoice-form" autocomplete="off"></form>
        <div class="line-items">
          <h4>Conceptos</h4>
          <table>
            <thead><tr><th>Cant.</th><th>Descripción</th><th class="num">Importe</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
          <button type="button" class="link-btn add-line-btn">+ Añadir concepto</button>
        </div>
        <details class="raw-text">
          <summary>Texto detectado (OCR)</summary>
          <textarea readonly></textarea>
        </details>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <script src="parser.js"></script>
    <script src="app.js"></script>
  </body>
</html>
